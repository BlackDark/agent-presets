# CI for every repo (from BlackDark/agent-presets). Copy to .github/workflows/ci.yml.
# - One workflow, one required check: `check`. Area jobs can be added, renamed or skipped without touching the ruleset.
#   Required checks match by NAME across ALL workflows. Do not add a second workflow with its own gate (a fast
#   `lint.yml` gate once satisfied the ruleset before CI finished); put checks here as another area instead.
# - Areas: `app` runs `mise run check`; `lint` checks workflows and Renovate config. PRs run only the areas they
#   touch (docs-only PRs run neither); main, workflow_call and manual runs run every area. Tags arrive via
#   release.yml calling this workflow (workflow_call) with `ref` set to that tag, so no tag trigger here:
#   it would run CI twice. Empty `ref` checks out the caller ref. A non-empty `ref` runs every area,
#   because the PR diff is then the wrong tree. Later jobs check out the commit `changes` resolved.
# - One code area (most repos): keep the file as is. Several (frontend + firmware, ansible + pulumi): copy the `app`
#   job per area, add its output and a line in `changes`, and its name to the `check` job's `needs`.
#   Check out `needs.changes.outputs.sha`, not `inputs.ref`.
# - No Renovate config or nothing else to lint: delete the `lint` jobs, their output and the name in `needs`.
# - Path detection uses plain git: a PR checkout with an empty `ref` is the merge commit, so HEAD^1..HEAD is
#   exactly the PR's diff. No third-party action and no extra permission, so release.yml can still call this
#   with `contents: read`.
# - `check` needs `if: always()`: a skipped job reports success, so without it a failed area would leave the gate green.
#   Cancelled counts as failed, so a manually cancelled run can't be merged either.
# - Draft PRs skip `changes`; area jobs inherit the skip and `check` passes (drafts can't be merged anyway).
# - Caches save only when this file is the workflow that push to main started (`github.workflow == 'CI'`).
#   A called workflow inherits the caller's github context, so a release-please push to main would otherwise
#   save. PRs and release calls stay restore-only. Saves from PRs crowd the 10 GB
#   repo budget and are invisible to other branches; saves from a release run are a cache-poisoning path.
#   Keys hash the lockfile, so a dep bump starts fresh and restore-keys fall back to the last main cache.
#   New slow step (> ~30 s download or build)? Cache it the same way, or explain in AGENTS.md why not.
# - Merge queue: add `merge_group:` to `on:`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out. Empty uses the caller ref.
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # renovate: datasource=npm depName=renovate
  RENOVATE_VERSION: "44.198.0"

jobs:
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.areas.outputs.app }}
      lint: ${{ steps.areas.outputs.lint }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 2 # the merge commit and its base parent
          persist-credentials: false
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: areas
        env:
          CHECKOUT_REF: ${{ inputs.ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || [ -n "$CHECKOUT_REF" ]; then
            { echo "app=true"; echo "lint=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # NUL-delimited: any filename is classified whole
          git diff --no-renames --name-only -z HEAD^1 HEAD > "$RUNNER_TEMP/changed-paths"
          app=false
          lint=false
          while IFS= read -r -d '' path; do
            case "$path" in
              .github/workflows/*) app=true ;; # ci.yml and workflows it calls
            esac
            case "$path" in
              docs/*|.github/*|renovate.json|renovate.json5|LICENSE|*.md) ;;
              *) app=true ;;
            esac
            case "$path" in
              .github/*|renovate.json|renovate.json5|mise.toml|.mise.toml|mise.lock|.mise.lock|.config/mise*|mise/*|.mise/*) lint=true ;;
            esac
          done < "$RUNNER_TEMP/changed-paths"
          { echo "app=$app"; echo "lint=$lint"; } >> "$GITHUB_OUTPUT"

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9 tools from mise.toml; Rust from rust-toolchain.toml via rustup
        with:
          cache_save: ${{ github.workflow == 'CI' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
      # TS repos only. Delete the cache steps a repo doesn't need.
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # Rust repos only
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.workflow == 'CI' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
      - run: mise run check
      - if: github.workflow == 'CI' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

  actionlint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: actionlint # own cache key (mise hashes install_args), so saving is safe
          cache_save: ${{ github.workflow == 'CI' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
      - run: actionlint -color

  renovate-config:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - run: npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict

  zizmor:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@bd12b495c90993a4301c73398142281a61499af3 # v0.9.0
        with:
          inputs: .github/workflows
          advanced-security: false
          annotations: true

  check:
    if: always()
    needs: [changes, app, actionlint, renovate-config, zizmor]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
