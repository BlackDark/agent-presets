# Reusable lint area for consumer repos: actionlint (attested), zizmor, renovate-config-validator.
# Call it from ci.yml (pin the SHA; Renovate bumps it):
#   lint:
#     needs: changes
#     if: needs.changes.outputs.lint == 'true'
#     uses: BlackDark/agent-presets/.github/workflows/lint.yml@<sha> # vX
#     with:
#       ref: ${{ needs.changes.outputs.sha }}
# Tool versions live here; consumers drop actionlint from mise.toml and their own lint jobs.
name: lint

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to lint. Empty uses the caller ref.
        type: string
        default: ""
      zizmor-inputs:
        description: Paths zizmor audits.
        type: string
        default: .github/workflows
      renovate:
        description: Validate the repo's Renovate config.
        type: boolean
        default: true

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=rhysd/actionlint
  ACTIONLINT_VERSION: "1.7.12"
  # renovate: datasource=npm depName=renovate
  RENOVATE_VERSION: "44.255.2"

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          gh release download "v${ACTIONLINT_VERSION}" --repo rhysd/actionlint --pattern "$archive" --dir "$RUNNER_TEMP"
          gh attestation verify "$RUNNER_TEMP/$archive" --repo rhysd/actionlint
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@bd12b495c90993a4301c73398142281a61499af3 # v0.9.0
        with:
          inputs: ${{ inputs.zizmor-inputs }}
          advanced-security: false
          annotations: true

  renovate-config:
    if: inputs.renovate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - run: npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict
