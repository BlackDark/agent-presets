name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=rhysd/actionlint
  ACTIONLINT_VERSION: "1.7.7"
  # renovate: datasource=npm depName=renovate
  RENOVATE_VERSION: "42.99.0"

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"
          # snippets call ./.github/workflows/ci.yml, which exists only in the target repo
          ./actionlint -color -ignore "could not read reusable workflow file" .github/workflows/*.yml snippets/*.yml

  renovate-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: renovate-config-validator
        # Template validated as a repo config, the way target repos load it; then this repo's own
        run: |
          mkdir -p "$RUNNER_TEMP/repo/.github"
          cp templates/renovate.template.json5 "$RUNNER_TEMP/repo/.github/renovate.json5"
          (cd "$RUNNER_TEMP/repo" && npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict)
          npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .github/workflows snippets/*.yml
          advanced-security: false
          annotations: true

  # The one required check in the ruleset (same gate as snippets/ci-paths.yml)
  check:
    if: always()
    needs: [actionlint, renovate-config, zizmor]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
