# This repo's own CI: snippets/ci.yml with only the `lint` area (no app code), plus linting of the snippets
# and the Renovate template. One workflow, one required check: `check`. Draft PRs and docs-only PRs skip.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call: # the release snippets call this file; none runs here, but they are linted against it
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # renovate: datasource=github-releases depName=rhysd/actionlint
  ACTIONLINT_VERSION: "1.7.12"
  # renovate: datasource=npm depName=renovate
  RENOVATE_VERSION: "44.221.1"

jobs:
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lint: ${{ steps.areas.outputs.lint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the merge commit and its base parent
          persist-credentials: false
      - id: areas
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "lint=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --no-renames --name-only -z HEAD^1 HEAD > "$RUNNER_TEMP/changed-paths"
          lint=false
          while IFS= read -r -d '' path; do
            case "$path" in
              .github/*|snippets/*|templates/renovate.template.json5) lint=true ;;
            esac
          done < "$RUNNER_TEMP/changed-paths"
          echo "lint=$lint" >> "$GITHUB_OUTPUT"

  actionlint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          gh release download "v${ACTIONLINT_VERSION}" --repo rhysd/actionlint --pattern "$archive"
          gh attestation verify "$archive" --repo rhysd/actionlint
          tar -xzf "$archive" actionlint
          # snippets call ./.github/workflows/ci.yml, which exists only in the target repo
          ./actionlint -color -ignore "could not read reusable workflow file"
          ./actionlint -color -ignore "could not read reusable workflow file" snippets/*.yml

  renovate-config:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: renovate-config-validator
        # Template validated as a repo config, the way target repos load it; then this repo's own
        run: |
          mkdir -p "$RUNNER_TEMP/repo/.github"
          cp templates/renovate.template.json5 "$RUNNER_TEMP/repo/.github/renovate.json5"
          (cd "$RUNNER_TEMP/repo" && npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict)
          npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict

  zizmor:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          inputs: .github/workflows snippets/*.yml
          advanced-security: false
          annotations: true

  # Exercises the reusable workflow consumers call
  lint-reusable:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    uses: ./.github/workflows/lint.yml # zizmor: ignore[self-repository] tests this commit's version
    with:
      renovate: false # renovate-config job above validates template + own config

  # The one required check in the ruleset
  check:
    if: always()
    needs: [changes, actionlint, renovate-config, zizmor, lint-reusable]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
